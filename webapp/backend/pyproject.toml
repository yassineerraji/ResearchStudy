# Packaging and dependency configuration for the hosted web backend.
#
# This manifest is deliberately separate from the research package's own
# pyproject.toml at the repository root. The core simulator's dependency list
# (networkx/pydantic/PyYAML/openai only) stays untouched; FastAPI, uvicorn,
# and any other web-serving dependencies live only here. The backend depends
# on the core package (installed editable) to reuse its config models and
# validation instead of reimplementing them.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-webapp-backend"
version = "0.1.0"
description = "FastAPI backend serving the hosted frontend for the Supply-Chain Agent Evaluation project."
requires-python = ">=3.12,<3.14"
authors = [{ name = "Yassine ERRAJI" }]

# The core research package (supply-chain-agent-evaluation) is a separate,
# editable install from the repository root (`pip install -e ../..`) rather
# than a `dependencies` entry here: pyproject.toml has no portable way to
# express a relative local-path dependency, and the repo root's own
# pyproject.toml is the one place that package's version is declared.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"

# supply_chain_simulator ships no py.typed marker (it's a separate,
# independently-versioned package this backend depends on, not something
# this pass touches) — mypy can't see its inferred types without one, so
# treat its API surface as untyped rather than failing every import site.
[[tool.mypy.overrides]]
module = "supply_chain_simulator.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
