# A cost-calibration variant of baseline_comparison.yaml (the "Medium"
# profile): identical in every parameter -- same network, scenario,
# policies, horizon, drain, and base_seed -- except replications is 3
# instead of 100. Because base_seed is unchanged, these 3 replications are
# not just "similar" to the real run's first 3 replications, they are
# exactly them (same random demand/delay draws), used only to measure real
# OpenAI spend at full horizon/drain scale before committing to the full
# 100-replication run.

schema_version: 1
experiment_id: baseline_port_closure_comparison_calibration

network_config: ../networks/baseline_network.yaml
scenario_config: ../scenarios/port_closure.yaml

policy_configs:
  heuristic: ../policies/heuristic.yaml
  llm_agent: ../policies/llm_agent.yaml

warmup_days: 20
horizon_days: 60
drain_days: 30
terminal_penalty_days: 30

replications: 3
base_seed: 1042

counterfactual_mode: POLICY_SPECIFIC
fail_fast: true

output_root: ../../outputs
write_event_tapes: true
write_daily_metrics: true
write_decision_traces: true
write_llm_interactions: true
