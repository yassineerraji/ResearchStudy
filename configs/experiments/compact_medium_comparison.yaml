# Combines the Compact topology, the "Medium" primary-port-closure scenario,
# and two policies into one paired experiment -- the Compact x Medium cell
# of the topology x severity grid. Reuses the same
# base_seed as compact_light_comparison.yaml and compact_heavy_comparison.yaml
# (see that file's header for why), and the same network as both.

schema_version: 1
experiment_id: compact_medium_comparison

network_config: ../networks/topology_compact.yaml
scenario_config: ../scenarios/port_closure.yaml

policy_configs:
  heuristic: ../policies/heuristic.yaml
  llm_agent: ../policies/llm_agent.yaml

warmup_days: 20
horizon_days: 60
drain_days: 30
terminal_penalty_days: 30

replications: 33
base_seed: 2042

counterfactual_mode: POLICY_SPECIFIC
fail_fast: true

output_root: ../../outputs
write_event_tapes: true
write_daily_metrics: true
write_decision_traces: true
write_llm_interactions: true
