# Defines the "Light" disruption profile: the primary port stays open and
# reachable, but its daily departure throughput is cut hard for a week. This
# is a degraded-capacity event rather than a full stoppage, used alongside
# port_closure.yaml (Medium) and port_extended_closure.yaml (Heavy) to give
# the paired comparison a realistic spread of disruption severity, not just
# one fixed scenario. Both policies receive the same complete information
# when the reduction begins.

schema_version: 1
scenario_id: primary_port_partial_capacity
description: Primary port stays open but runs at reduced departure capacity for a week.

shocks:
  - shock_id: reduce_primary_port_capacity
    shock_type: NODE_CAPACITY_REDUCTION
    target_type: NODE
    target_id: port_primary
    planned_start_day: 21
    start_day_jitter_days: 0
    minimum_duration_days: 7
    duration_mean_days: 7
    duration_std_days: 0
    maximum_duration_days: 7
    max_information_delay_days: 0
    capacity_multiplier: 0.25
    lead_time_multiplier: 1.0
    cost_multiplier: 1.0
