# Defines the "Light" disruption profile: the primary port stays open and
# reachable, but its daily departure throughput is cut hard for roughly a
# week. This is a degraded-capacity event rather than a full stoppage, used
# alongside port_closure.yaml (Medium) and port_extended_closure.yaml
# (Heavy) to give the paired comparison a realistic spread of disruption
# severity, not just one fixed scenario. As with every V2 severity scenario,
# the exact start day, duration, and disclosure delay are uncertain --
# sampled once per replication, not fixed.

schema_version: 1
scenario_id: primary_port_partial_capacity
description: Primary port stays open but runs at reduced departure capacity for roughly a week, with uncertain timing.

shocks:
  - shock_id: reduce_primary_port_capacity
    shock_type: NODE_CAPACITY_REDUCTION
    target_type: NODE
    target_id: port_primary
    planned_start_day: 25
    start_day_jitter_days: 3
    minimum_duration_days: 4
    duration_mean_days: 7
    duration_std_days: 2
    maximum_duration_days: 11
    max_information_delay_days: 1
    capacity_multiplier: 0.25
    lead_time_multiplier: 1.0
    cost_multiplier: 1.0
