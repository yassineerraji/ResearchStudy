# Defines the Extended topology tier's "Heavy" disruption profile. Mirrors
# port_extended_closure.yaml's structure and magnitudes exactly (extended
# closure of the tier's critical node, plus a knock-on congestion effect on
# a route that survives the closure and absorbs the diverted traffic),
# retargeted to hub_1 -- see hub_closure_extended.yaml (Medium) and
# hub_partial_capacity_extended.yaml (Light) for this tier's other two
# severities. alternative_port_to_hub_2 is one of the 5 non-emergency paths
# that survive hub_1's closure (verified during topology design), making it
# the natural route to model as congested by diverted traffic. The two
# shocks represent one correlated regional event and share one start-day
# jitter draw via event_group_id (V2 CLAUDE.md §V2.3.4).

schema_version: 1
scenario_id: hub_1_extended_closure_with_congestion
description: Extended closure of hub_1 plus congestion on a surviving alternate route, Extended's Heavy-severity counterpart to port_extended_closure.yaml.

shocks:
  - shock_id: close_hub_1_extended
    shock_type: NODE_CLOSURE
    target_type: NODE
    target_id: hub_1
    planned_start_day: 25
    start_day_jitter_days: 4
    minimum_duration_days: 14
    duration_mean_days: 21
    duration_std_days: 4
    maximum_duration_days: 28
    max_information_delay_days: 2
    capacity_multiplier: 1.0
    lead_time_multiplier: 1.0
    cost_multiplier: 1.0
    event_group_id: hub_1_regional_event_extended

  - shock_id: alternative_hub_2_congestion
    shock_type: EDGE_LEAD_TIME_INCREASE
    target_type: EDGE
    target_id: alternative_port_to_hub_2
    planned_start_day: 25
    start_day_jitter_days: 4
    minimum_duration_days: 14
    duration_mean_days: 21
    duration_std_days: 4
    maximum_duration_days: 28
    max_information_delay_days: 3
    capacity_multiplier: 1.0
    lead_time_multiplier: 1.75
    cost_multiplier: 1.0
    event_group_id: hub_1_regional_event_extended
