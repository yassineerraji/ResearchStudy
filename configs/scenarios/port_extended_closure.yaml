# Defines the "Heavy" disruption profile: a full primary-port closure that
# lasts three weeks instead of Medium's one, plus a realistic knock-on
# effect -- traffic diverted onto the alternate port's sea lane slows it
# down too. Used alongside port_closure.yaml (Medium) and
# port_partial_capacity.yaml (Light) to give the paired comparison a
# realistic spread of disruption severity. Both policies receive the same
# complete information for both shocks when they begin.

schema_version: 1
scenario_id: primary_port_extended_closure_with_congestion
description: Extended primary port closure plus alternate-route congestion from diverted traffic.

shocks:
  - shock_id: close_primary_port_extended
    shock_type: NODE_CLOSURE
    target_type: NODE
    target_id: port_primary
    physical_start_day: 21
    physical_end_day: 41
    information_day: 21
    capacity_multiplier: 1.0
    lead_time_multiplier: 1.0
    cost_multiplier: 1.0

  - shock_id: alternate_port_congestion
    shock_type: EDGE_LEAD_TIME_INCREASE
    target_type: EDGE
    target_id: alternative_port_to_hub
    physical_start_day: 21
    physical_end_day: 41
    information_day: 21
    capacity_multiplier: 1.0
    lead_time_multiplier: 1.75
    cost_multiplier: 1.0
