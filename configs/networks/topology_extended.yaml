# The Extended topology tier (V2 CLAUDE.md §V2.3.1): 4 ports and 4 hubs
# forming a genuine overlapping mesh -- 7 non-emergency supplier-to-plant
# paths (plus the emergency air lane), all <= 3 edges. supplier_1 and
# plant_1 are identical to Standard/Compact by construction; every edge
# shared with earlier revisions of this tier keeps its exact values, and
# new edges extrapolate the same per-mode cost/distance/reliability trend
# (longer distance -> higher cost/lead-time, slightly lower reliability).
#
# Betweenness centrality (networkx.betweenness_centrality) on this graph
# shows port_primary is now one of the *least* central nodes (tied lowest
# with hub_4), while hub_1 is tied for *most* central -- closing
# port_primary kills only 1 of 7 non-emergency paths, closing hub_1 kills 2
# of 7. Severity scenarios for this tier therefore target hub_1
# (configs/scenarios/hub_closure_extended.yaml), not port_primary.

