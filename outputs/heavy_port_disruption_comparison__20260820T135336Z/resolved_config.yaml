experiment:
  base_seed: 1042
  counterfactual_mode: POLICY_SPECIFIC
  drain_days: 30
  experiment_id: heavy_port_disruption_comparison
  fail_fast: true
  horizon_days: 60
  network_config: ../networks/baseline_network.yaml
  output_root: ../../outputs
  policy_configs:
    heuristic: ../policies/heuristic.yaml
    llm_agent: ../policies/llm_agent.yaml
  replications: 100
  scenario_config: ../scenarios/port_extended_closure.yaml
  schema_version: 1
  terminal_penalty_days: 30
  warmup_days: 20
  write_daily_metrics: true
  write_decision_traces: true
  write_event_tapes: true
  write_llm_interactions: true
heuristic_policy:
  cost_tolerance: 1.0e-09
  expedite_trigger_lateness_days: 2
  policy_id: heuristic
  policy_type: HEURISTIC
  schema_version: 1
llm_policy:
  api_key_environment_variable: OPENAI_API_KEY
  execution_mode: LIVE
  fallback_policy: HEURISTIC
  max_output_tokens: 1000
  max_retries: 3
  max_tool_calls: 8
  model_environment_variable: LLM_MODEL
  policy_id: llm_agent
  policy_type: LLM
  provider: OPENAI
  replay_trace_path: null
  request_timeout_seconds: 60
  schema_version: 1
  store_provider_response: false
  temperature: 0.0
network:
  action_costs:
    expedite_premium_per_unit: 10.0
    reroute_cost_per_unit: 2.0
  demand_process:
    destination_node_id: plant_1
    distribution: TRUNCATED_NORMAL
    maximum_daily_demand: 55
    mean_daily_demand: 40.0
    minimum_daily_demand: 25
    product_id: component_a
    standard_deviation: 5.0
  edges:
  - base_lead_time_days: 2
    daily_capacity: 100
    destination_node_id: port_primary
    distance_km: 400.0
    edge_id: supplier_to_primary_port
    emergency: false
    mode: ROAD
    origin_node_id: supplier_1
    reliability: 0.97
    unit_transport_cost: 4.0
  - base_lead_time_days: 10
    daily_capacity: 200
    destination_node_id: hub_1
    distance_km: 6000.0
    edge_id: primary_port_to_hub
    emergency: false
    mode: SEA
    origin_node_id: port_primary
    reliability: 0.94
    unit_transport_cost: 8.0
  - base_lead_time_days: 4
    daily_capacity: 60
    destination_node_id: port_alternative
    distance_km: 650.0
    edge_id: supplier_to_alternative_port
    emergency: false
    mode: ROAD
    origin_node_id: supplier_1
    reliability: 0.96
    unit_transport_cost: 7.0
  - base_lead_time_days: 12
    daily_capacity: 60
    destination_node_id: hub_1
    distance_km: 6700.0
    edge_id: alternative_port_to_hub
    emergency: false
    mode: SEA
    origin_node_id: port_alternative
    reliability: 0.93
    unit_transport_cost: 11.0
  - base_lead_time_days: 2
    daily_capacity: 120
    destination_node_id: plant_1
    distance_km: 300.0
    edge_id: hub_to_plant
    emergency: false
    mode: ROAD
    origin_node_id: hub_1
    reliability: 0.98
    unit_transport_cost: 3.0
  - base_lead_time_days: 2
    daily_capacity: 40
    destination_node_id: plant_1
    distance_km: 6200.0
    edge_id: supplier_to_plant_air
    emergency: true
    mode: AIR
    origin_node_id: supplier_1
    reliability: 0.99
    unit_transport_cost: 40.0
  initial_inventory:
  - node_id: plant_1
    product_id: component_a
    quantity: 200
  network_id: baseline_network
  nodes:
  - latitude: null
    longitude: null
    name: Primary Supplier
    node_id: supplier_1
    node_type: SUPPLIER
    processing_capacity: 200
    source_capacity: 100
    storage_capacity: 2000
  - latitude: null
    longitude: null
    name: Primary Port
    node_id: port_primary
    node_type: PORT
    processing_capacity: 200
    source_capacity: 0
    storage_capacity: 2000
  - latitude: null
    longitude: null
    name: Alternative Port
    node_id: port_alternative
    node_type: PORT
    processing_capacity: 80
    source_capacity: 0
    storage_capacity: 1200
  - latitude: null
    longitude: null
    name: Import Hub
    node_id: hub_1
    node_type: HUB
    processing_capacity: 200
    source_capacity: 0
    storage_capacity: 2000
  - latitude: null
    longitude: null
    name: Manufacturing Plant
    node_id: plant_1
    node_type: PLANT
    processing_capacity: 200
    source_capacity: 0
    storage_capacity: 1000
  products:
  - backlog_cost_per_unit_day: 3.0
    holding_cost_per_unit_day: 0.1
    late_penalty_per_unit_day: 1.5
    name: Component A
    product_id: component_a
  replenishment_plan:
    destination_node_id: plant_1
    due_offset_days: 15
    first_release_day: 1
    initial_route_edge_ids:
    - supplier_to_primary_port
    - primary_port_to_hub
    - hub_to_plant
    maximum_shipment_quantity: 40
    minimum_shipment_quantity: 40
    origin_node_id: supplier_1
    product_id: component_a
    release_every_days: 1
    shipment_quantity_mean: 40.0
    shipment_quantity_std: 0.0
  schema_version: 1
  units:
    currency: EUR
    distance: km
    quantity: units
    time: day
resolved_paths:
  experiment_config_path: /Users/yassine/Desktop/ResearchStudy/configs/experiments/heavy_disruption_comparison.yaml
  heuristic_config_path: /Users/yassine/Desktop/ResearchStudy/configs/policies/heuristic.yaml
  llm_config_path: /Users/yassine/Desktop/ResearchStudy/configs/policies/llm_agent.yaml
  network_config_path: /Users/yassine/Desktop/ResearchStudy/configs/networks/baseline_network.yaml
  output_root: /Users/yassine/Desktop/ResearchStudy/outputs
  scenario_config_path: /Users/yassine/Desktop/ResearchStudy/configs/scenarios/port_extended_closure.yaml
scenario:
  description: Extended primary port closure plus alternate-route congestion from
    diverted traffic, with uncertain shared onset and independent durations/disclosure.
  scenario_id: primary_port_extended_closure_with_congestion
  schema_version: 1
  shocks:
  - capacity_multiplier: 1.0
    cost_multiplier: 1.0
    demand_multiplier: 1.0
    duration_mean_days: 21.0
    duration_std_days: 4.0
    event_group_id: primary_port_regional_event
    lead_time_multiplier: 1.0
    max_information_delay_days: 2
    maximum_duration_days: 28
    minimum_duration_days: 14
    planned_start_day: 25
    shock_id: close_primary_port_extended
    shock_type: NODE_CLOSURE
    start_day_jitter_days: 4
    target_id: port_primary
    target_type: NODE
  - capacity_multiplier: 1.0
    cost_multiplier: 1.0
    demand_multiplier: 1.0
    duration_mean_days: 21.0
    duration_std_days: 4.0
    event_group_id: primary_port_regional_event
    lead_time_multiplier: 1.75
    max_information_delay_days: 3
    maximum_duration_days: 28
    minimum_duration_days: 14
    planned_start_day: 25
    shock_id: alternate_port_congestion
    shock_type: EDGE_LEAD_TIME_INCREASE
    start_day_jitter_days: 4
    target_id: alternative_port_to_hub
    target_type: EDGE
